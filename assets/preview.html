<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#7a7a7a;font:13px system-ui;color:#fff}
  .row{display:flex;gap:24px;align-items:center;padding:24px}
  .big{background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .smalls{display:flex;gap:16px;align-items:flex-end}
  .smalls img{display:block}
</style></head>
<body>
<div class="row">
  <img class="big" src="logo.svg" width="420" height="420">
  <div class="smalls">
    <img src="logo.svg" width="128" height="128">
    <img src="logo.svg" width="64" height="64">
    <img src="logo.svg" width="32" height="32">
    <img src="logo.svg" width="16" height="16">
  </div>
</div>
</body></html>
