[project]
name = "kurator"
version = "0.3.0"
description = "Офлайновый разбор фотографий: дубликаты, near-dupes, визуальные кластеры. Без облака."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "onnxruntime>=1.18",
    "pillow-heif>=1.0",
]

[project.scripts]
kurator = "kurator.cli:main"
kurator-desktop = "kurator.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    # Сборочная зависимость: в рантайме не участвует, нужна только
    # для сборки .app и .dmg. См. packaging/build.sh.
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kurator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
