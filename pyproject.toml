[project]
name = "kurator"
version = "0.1.0"
description = "Офлайновый разбор фотопарка: дубликаты, near-dupes, визуальные кластеры. Без облака."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "onnxruntime>=1.18",
]

[project.scripts]
kurator = "kurator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kurator"]

[tool.pytest.ini_options]
testpaths = ["tests"]